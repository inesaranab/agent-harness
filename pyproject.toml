[project]
name = "personal-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbos>=2.27.0",
    "e2b-code-interpreter>=2.8.1",
    "fastapi>=0.139.2",
    "openai>=2.46.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"] # style Errors (PEP 8), pyflakes, isort keep imports ordered

[tool.pytest.ini_options]
testpaths = ["tests"]
